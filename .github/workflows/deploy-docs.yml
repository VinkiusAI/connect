name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DOCS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DOCS_REGION }}

      - name: Sync to S3
        run: |
          # Assets estáticos — cache longo (imutáveis via content hash)
          aws s3 sync docs/dist/ "s3://${{ secrets.AWS_DOCS_BUCKET }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt"

          # HTML/XML/TXT — sem cache (sempre revalidar)
          aws s3 sync docs/dist/ "s3://${{ secrets.AWS_DOCS_BUCKET }}" \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront (fire and forget)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_DOCS_CF_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --no-cli-pager
          echo "Invalidation submitted — not waiting for completion."
